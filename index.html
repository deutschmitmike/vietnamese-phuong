<style>
:root{--ok-ink:#fff;--bg:#f6f4ef;--panel:#fff;--ink:#1d2129;--muted:#6b7280;--line:#e4e1d8;--accent:#0f766e;--accent-ink:#fff;--ok:#1f9d55;--again:#c2410c;--miss:#dc2626;--mark:#b45309;--soft:#eef6f4;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--ok-ink:#062b1d;--bg:#16181c;--panel:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#2f333b;--accent:#2dd4bf;--accent-ink:#0b1f1c;--ok:#34d399;--again:#fb923c;--miss:#f87171;--mark:#fbbf24;--soft:#17302d;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
section{display:none}section.on{display:block}
header{margin:6px 0 14px}h1{font-size:26px;margin:0;letter-spacing:-.01em}h2{font-size:21px;margin:2px 0 6px}
.sub,.muted{color:var(--muted);font-size:15px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kicker.sect{margin:18px 0 6px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.panel p{margin:6px 0}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0 14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn svg{width:22px;height:22px}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font-size:18px;margin-top:8px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.again{background:transparent;border-color:var(--again);color:var(--again)}
.btn.play.on{outline:3px solid var(--accent);outline-offset:1px}
.link.undo{padding:6px 0 6px 6px;font-size:15px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{flex-direction:column;align-items:flex-start;text-align:left;min-height:78px;padding:12px 14px}
.tile small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.3}
.tile.wide{width:100%;margin-bottom:10px}
footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon{background:none;border:0;color:var(--ink);padding:6px;margin-left:-6px;cursor:pointer;display:inline-flex}
.icon svg{width:26px;height:26px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vi{font-size:27px;line-height:1.35;font-weight:600;margin:6px 0 4px}
.vi.s{font-size:18px;margin:0}
.gl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;margin:8px 0 6px;font-size:24px}
.gl.s{font-size:18px;gap:6px 11px;margin:2px 0 4px}
.gl .u{display:inline-flex;flex-direction:column;align-items:center;text-align:center;max-width:9em}
.gl .v{font-weight:600;line-height:1.25}
.gl .z{font-size:14px;color:var(--muted);line-height:1.25;margin-top:3px}
.gl.s .z{font-size:13px}
.gl .h{font-size:12px;color:var(--accent);line-height:1.2}
.notes .x{margin-bottom:6px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}.exs{margin:6px 0 10px}.exb{flex:1;min-width:0}
.ex .btn.play,.btn.play.mini{flex:none;min-height:36px;padding:6px 9px}.btn.play.mini svg,.ex .btn.play svg{width:16px;height:16px}
.zh.s{font-size:15px}
.wl{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.wlt{flex:1;min-width:0}
.wl b{font-size:18px}.wlh{color:var(--accent);font-size:14px}.wlz{font-size:15px}.wle{font-size:14px;color:var(--muted)}
.meaning{font-size:17px;margin-top:6px}.meaning.big{font-size:22px;font-weight:600;margin-top:10px}.meaning.s{font-size:15px;color:var(--muted);margin:0}
.zh{color:var(--muted);font-size:16px}.zh.big{font-size:20px;margin-top:4px}.zh.s{font-size:15px}
.wl{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.wlt{flex:1;min-width:0}
.wl b{font-size:18px}.wlh{color:var(--accent);font-size:14px}.wlz{font-size:15px}.wle{font-size:14px;color:var(--muted)}
.hint{color:var(--muted);font-size:15px}.hint.small{font-size:13px;margin:6px 0}
.notes{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.notes .hz{font-weight:600;margin-bottom:4px}
.vm{text-decoration:underline dotted var(--mark) 2.5px;text-underline-offset:5px;cursor:pointer}
.markinfo{display:none;border-left:3px solid var(--mark);padding:2px 0 2px 10px;margin:8px 0;font-size:15px}.markinfo p{margin:2px 0}
.plays{display:flex;gap:10px;margin-top:14px}.plays .btn.big{flex:2;margin:0}.plays .btn:not(.big){flex:1}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.rate .btn{min-height:58px;font-size:18px}
#card .rate,#chat .rate{grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.btn.easy{background:transparent;border-color:var(--ok);color:var(--ok)}
.dots{display:flex;gap:8px;margin:6px 0 4px}
.minutes{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;font-size:15px;color:var(--muted)}
.seg{display:flex;gap:6px}.seg .btn{min-height:38px;padding:6px 11px;font-size:15px}.seg .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px}
.dot span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.dot span.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}.dot span.miss{background:var(--miss);border-color:var(--miss)}
.dot small{font-size:11px;color:var(--muted)}.dot small.now{color:var(--ink);font-weight:700}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .btn{min-height:40px;padding:8px 10px}.row .btn svg{width:18px;height:18px}
.rt{flex:1;min-width:0}
.tag{font-size:11px;border-radius:8px;padding:2px 7px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.sure{background:var(--ok);color:var(--ok-ink)}.tag.learning{background:var(--soft);color:var(--accent)}
input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 6px}
.form label{display:block;font-weight:600;font-size:15px;margin-bottom:12px}.form textarea{margin-top:6px;font-weight:400}
.hardlist{list-style:none;padding:0;margin:6px 0}.hardlist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hardlist small{color:var(--muted);white-space:nowrap}
.toggles{display:flex;gap:18px;align-items:center;margin-top:12px;font-size:15px;color:var(--muted)}
.page{font-size:16px}.page h3{font-size:17px;margin:16px 0 4px}.page ul{padding-left:20px}.page li{margin:3px 0}
.page .tw{overflow-x:auto;margin:8px 0}.page table{border-collapse:collapse;font-size:14px;min-width:100%}
.page th,.page td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:top}.page td:first-child{white-space:nowrap}
.page .btn.play{min-height:40px;padding:6px 12px;margin:3px 6px 3px 0;font-weight:500;font-size:16px}
.page .btn.play svg{width:16px;height:16px}
.ab{color:var(--muted);font-weight:400;font-size:.7em}.tags{margin:8px 0 2px}
.who{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px}
.dlg{margin-top:10px}.dl{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.dl .btn.play{grid-row:span 3;min-height:36px;padding:6px 9px}.dl .btn.play svg{width:16px;height:16px}.dl b{font-size:12px;color:var(--accent)}.dl span{font-size:18px;font-weight:600}.dl small{color:var(--muted);font-size:14px}
.pn{font-style:italic;color:var(--muted);margin-top:6px}
.ab{padding:12px 0;border-bottom:1px solid var(--line)}.alorig{font-weight:600;margin-bottom:6px}.al{display:grid;grid-template-columns:auto 1fr;column-gap:10px;padding:6px 0 6px 10px;border-left:3px solid var(--line);margin:4px 0}.al b,.al small,.al i{grid-column:2}.al .btn.play{grid-row:span 3;min-height:34px;padding:5px 8px}.al .btn.play svg{width:15px;height:15px}.al small{color:var(--muted)}.al i{font-size:13px;color:var(--accent);font-style:normal}
.recrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.recrow .btn{min-height:40px;padding:8px 12px;font-size:15px}.btn.rec.on{border-color:var(--miss);color:var(--miss)}
.ans{margin-top:6px}
.nt{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}.nt b{font-size:18px}.nt span{font-size:16px}.nt small{color:var(--muted);font-size:14px}
body.banner{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#update{display:none;position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;text-align:center;font-weight:600;cursor:pointer;z-index:9}

  let KEY_ = null;

  window.PH_CLIP = (function () {
    const pending = new Map(), done = new Map(), order = [];
    function get(p) {
      if (!pending.has(p)) {
        const pr = fetch(p + ".enc").then(r => { if (!r.ok) throw new Error("clip " + r.status); return r.arrayBuffer(); })
          .then(b => open(KEY_, new Uint8Array(b)))
          .then(plain => {

            while (order.length > 80) { const q = order.shift(), v = done.get(q); done.delete(q); pending.delete(q); setTimeout(() => URL.revokeObjectURL(v), 60000); }

          });
        pending.set(p, pr);
        pr.catch(() => pending.delete(p));
      }
      return pending.get(p);

      const pass = document.getElementById("ph_pass").value;
      if (!pass) return;
