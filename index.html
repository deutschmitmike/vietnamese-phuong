gain: …過…嗎？ or 有沒有…過？","pn":"","who":"Mike","type":"line","audio":"clips/d01/l18.m4a","item":"d01.l18","kind":"s","dir":"L"},"d01.l18:S":{"vi":"Không, bây giờ anh sống ở Bồ Đào Nha và dạy online. Em đi Bồ Đào Nha lần nào chưa?","en":"No, now I live in Portugal and teach online. Have you ever been to Portugal?","zh":"沒有，我現在住在葡萄牙，在線上教課。你去過葡萄牙嗎？","g":[["Không,","沒有"],["bây giờ","現在"],["anh","我"],["sống","住"],["ở","在"],["Bồ Đào Nha","葡萄牙","葡萄牙"],["và","和"],["dạy","教"],["online.","線上"],["Em","你"],["đi","去"],["Bồ Đào Nha","葡萄牙","葡萄牙"],["lần nào","任何一次"],["chưa?","了沒"]],"x":"Bồ Đào Nha is the Hán Việt reading of 葡萄牙. lần nào chưa again: …過…嗎？ or 有沒有…過？","pn":"","who":"Mike","type":"line","audio":"clips/d01/l18.m4a","item":"d01.l18","kind":"s","dir":"S"},"d01.l19:L":{"vi":"Dạ chưa, nhưng nghe nói ở đó đẹp lắm.","en":"Not yet, but I've heard it's very beautiful.","zh":"還沒有，不過聽說那裡很漂亮。","g":[["Dạ","（禮貌語氣）"],["chưa,","還沒"],["nhưng","但是"],["nghe nói","聽說"],["ở đó","那裡"],["đẹp","漂亮"],["lắm.","很"]],"x":"Dạ chưa = 還沒, polite. lắm after an adjective = 很.","pn":"","who":"Phương","type":"line","audio":"clips/d01/l19.m4a","item":"d01.l19","kind":"s","dir":"L"},"d01.l19:S":{"vi":"Dạ chưa, nhưng nghe nói ở đó đẹp lắm.","en":"Not yet, but I've heard it's very beautiful.","zh":"還沒有，不過聽說那裡很漂亮。","g":[["Dạ","（禮貌語氣）"],["chưa,","還沒"],["nhưng","但是"],["nghe nói","聽說"],["ở đó","那裡"],["đẹp","漂亮"],["lắm.","很"]],"x":"Dạ chưa = 還沒, polite. lắm after an adjective = 很.","pn":"","who":"Phương","type":"line","audio":"clips/d01/l19.m4a","item":"d01.l19","kind":"s","dir":"S"},"d01.l20:L":{"vi":"Ừ, đẹp lắm. Có biển, trời nắng, đồ ăn cũng ngon nữa.","en":"Yes, very beautiful. There's the sea, lots of sun, and the food is good too.","zh":"嗯，很漂亮。有海，太陽很大，東西也很好吃。","g":[["Ừ,","嗯"],["đẹp","漂亮"],["lắm.","很"],["Có","有"],["biển,","海"],["trời","天"],["nắng,","陽光"],["đồ ăn","食物"],["cũng","也"],["ngon","好吃"],["nữa.","還"]],"x":"Ừ = yes, casual, to someone younger. cũng … nữa = also, on top of that: nữa at the end adds one more thing.","pn":"","who":"Mike","type":"line","audio":"clips/d01/l20.m4a","item":"d01.l20","kind":"s","dir":"L"},"d01.l20:S":{"vi":"Ừ, đẹp lắm. Có biển, trời nắng, đồ ăn cũng ngon nữa.","en":"Yes, very beautiful. There's the sea, lots of sun, and the food is good too.","zh":"嗯，很漂亮。有海，太陽很大，東西也很好吃。","g":[["Ừ,","嗯"],["đẹp","漂亮"],["lắm.","很"],["Có","有"],["biển,","海"],["trời","天"],["nắng,","陽光"],["đồ ăn","食物"],["cũng","也"],["ngon","好吃"],["nữa.","還"]],"x":"Ừ = yes, casual, to someone younger. cũng … nữa = also, on top of that: nữa at the end adds one more thing.","pn":"","who":"Mike","type":"line","audio":"clips/d01/l20.m4a","item":"d01.l20","kind":"s","dir":"S"},"d01.l21:L":{"vi":"Nghe thích quá! Sau này em cũng muốn đi.","en":"Sounds great! I'd like to go someday too.","zh":"聽起來好棒！以後我也想去。","g":[["Nghe","聽起來"],["thích","喜歡"],["quá!","好"],["Sau này","以後"],["em","我"],["cũng","也"],["muốn","想"],["đi.","去"]],"x":"Nghe thích quá = 聽起來好棒, word for word \"hearing it, I like it a lot\". Sau này = 以後, some day.","pn":"","who":"Phương","type":"line","audio":"clips/d01/l21.m4a","item":"d01.l21","kind":"s","dir":"L"},"d01.l21:S":{"vi":"Nghe thích quá! Sau này em cũng muốn đi.","en":"Sounds great! I'd like to go someday too.","zh":"聽起來好棒！以後我也想去。","g":[["Nghe","聽起來"],["thích","喜歡"],["quá!","好"],["Sau này","以後"],["em","我"],["cũng","也"],["muốn","想"],["đi.","去"]],"x":"Nghe thích quá = 聽起來好棒, word for word \"hearing it, I like it a lot\". Sau này = 以後, some day.","pn":"","who":"Phương","type":"line","audio":"clips/d01/l21.m4a","item":"d01.l21","kind":"s","dir":"S"}},"lessons":[{"key":"d01","n":1,"title":"Làm quen (Getting to know each other)","ids":["d01.l01:L","d01.l02:L","d01.l03:L","d01.l04:L","d01.l05:L","d01.l06:L","d01.l07:L","d01.l08:L","d01.l09:L","d01.l10:L","d01.l11:L","d01.l12:L","d01.l13:L","d01.l14:L","d01.l15:L","d01.l16:L","d01.l17:L","d01.l18:L","d01.l19:L","d01.l20:L","d01.l21:L","d01.l01:S","d01.l02:S","d01.l03:S","d01.l04:S","d01.l05:S","d01.l06:S","d01.l07:S","d01.l08:S","d01.l09:S","d01.l10:S","d01.l11:S","d01.l12:S","d01.l13:S","d01.l14:S","d01.l15:S","d01.l16:S","d01.l17:S","d01.l18:S","d01.l19:S","d01.l20:S","d01.l21:S"],"pages":[{"t":"The dialogue","h":"<p>Read it once, with Phương's recording. The cards start after this.<\/p><div class=\"pls\" data-lesson=\"d01\"><\/div><div class=\"dlg\"><div class=\"dl\"><b>Phương<\/b><span>Em chào anh! Em tên Phương. Anh tên gì?<\/span><small>Hi! My name is Phương. What&#x27;s your name?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Chào em. Anh tên Mike. Rất vui được gặp em nha.<\/span><small>Hi. My name is Mike. Nice to meet you.<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Em cũng rất vui được gặp anh. Anh là người nước nào vậy?<\/span><small>Nice to meet you too. Where are you from?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Anh sinh ra và lớn lên ở Đức. Còn em? Em là người Sài Gòn hả?<\/span><small>I was born and raised in Germany. And you? Are you from Saigon?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Dạ không, em là người Đồng Nai, nhưng em sống ở Sài Gòn lâu rồi.<\/span><small>No, I&#x27;m from Đồng Nai, but I&#x27;ve lived in Saigon for a long time.<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Em sống ở Sài Gòn bao lâu rồi?<\/span><small>How long have you lived in Saigon?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Dạ, cũng hơn bảy năm rồi anh. Mà anh là người Đức hả?<\/span><small>More than seven years now. By the way, are you German?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Đúng rồi. Nhưng ba anh là người Hoa, còn mẹ anh là người Trung Quốc.<\/span><small>Right. But my dad is ethnic Chinese (người Hoa), and my mom is from China.<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Ồ, thú vị quá! Ba anh quê ở đâu?<\/span><small>Oh, interesting! Where is your dad from?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Ba anh là người Cần Thơ. Em đi Cần Thơ lần nào chưa?<\/span><small>My dad is from Cần Thơ. Have you ever been to Cần Thơ?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Em chưa, em chưa đi miền Tây bao giờ. Ở nhà anh nói tiếng gì?<\/span><small>No, I haven&#x27;t. I&#x27;ve never been to the Mekong Delta. What language do you speak at home?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Ở nhà anh chỉ nói tiếng Trung. Em có biết nói tiếng Trung không?<\/span><small>At home I only speak Mandarin. Can you speak Mandarin?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Em đang học tiếng Trung, nên chỉ biết nói một chút. Anh năm nay bao nhiêu tuổi?<\/span><small>I&#x27;m learning Mandarin, so I can only speak a little. How old are you this year?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Anh ba mươi tám tuổi. Còn em, em sinh năm mấy?<\/span><small>I&#x27;m 38. And you, what year were you born?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Em sinh năm hai ngàn. Anh đang làm công việc gì?<\/span><small>I was born in 2000. What do you do for work?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Anh là giáo viên tiếng Đức. Mình đều là giáo viên ha!<\/span><small>I&#x27;m a German teacher. So we&#x27;re both teachers!<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Dạ đúng rồi! Anh đang sống ở Đức hả?<\/span><small>That&#x27;s right! Do you live in Germany?<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Không, bây giờ anh sống ở Bồ Đào Nha và dạy online. Em đi Bồ Đào Nha lần nào chưa?<\/span><small>No, now I live in Portugal and teach online. Have you ever been to Portugal?<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Dạ chưa, nhưng nghe nói ở đó đẹp lắm.<\/span><small>Not yet, but I&#x27;ve heard it&#x27;s very beautiful.<\/small><\/div><div class=\"dl\"><b>Mike<\/b><span>Ừ, đẹp lắm. Có biển, trời nắng, đồ ăn cũng ngon nữa.<\/span><small>Yes, very beautiful. There&#x27;s the sea, lots of sun, and the food is good too.<\/small><\/div><div class=\"dl\"><b>Phương<\/b><span>Nghe thích quá! Sau này em cũng muốn đi.<\/span><small>Sounds great! I&#x27;d like to go someday too.<\/small><\/div><\/div>"},{"t":"Key patterns","h":"<p>What we drill and ask each other about in class.<\/p><div class=\"nts\"><div class=\"nt\"><b>Còn em? / Còn em thì sao?<\/b><span>And you? (turn the question back)<\/span><small>Lines 4, 14<\/small><\/div><div class=\"nt\"><b>… hả?<\/b><span>… right? (checking something you think is true)<\/span><small>Lines 4, 7, 17<\/small><\/div><div class=\"nt\"><b>Mà …<\/b><span>By the way … (changing the topic)<\/span><small>Lines 7<\/small><\/div><div class=\"nt\"><b>… bao lâu rồi?<\/b><span>How long have you been …?<\/span><small>Lines 6<\/small><\/div><div class=\"nt\"><b>… lần nào chưa?<\/b><span>Have you ever …?<\/span><small>Lines 10, 18<\/small><\/div><\/div>"},{"t":"Alternatives","h":"<p>Other ways to say a line, marked by Phương. A play button appears once she has recorded them; then they also come as cards.<\/p><div class=\"ab\"><div class=\"kicker\">Line 1 · Phương<\/div><div class=\"alorig\">Em chào anh! Em tên Phương. Anh tên gì?<\/div><div class=\"al\"><b>Em gọi anh là gì ạ?<\/b><small>What should I call you? (like 怎麼稱呼)<\/small><i>✗ North<\/i><\/div><div class=\"al\"><b>Em tên Phương.<\/b><small>My name is Phương. (casual, drops &quot;là&quot;)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 2 · Mike<\/div><div class=\"alorig\">Chào em. Anh tên Mike. Rất vui được gặp em nha.<\/div><div class=\"al\"><b>Em cứ gọi anh là Mike.<\/b><small>Just call me Mike.<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 3 · Phương<\/div><div class=\"alorig\">Em cũng rất vui được gặp anh. Anh là người nước nào vậy?<\/div><div class=\"al\"><b>Em cũng vậy.<\/b><small>Me too.<\/small><i>✓<\/i><\/div><div class=\"al\"><b>Anh người nước nào?<\/b><small>Where are you from? (casual, drops &quot;là&quot;)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 4 · Mike<\/div><div class=\"alorig\">Anh sinh ra và lớn lên ở Đức. Còn em? Em là người Sài Gòn hả?<\/div><div class=\"al\"><b>Anh sinh ra và lớn lên bên Đức. Bên này lạnh lắm<\/b><small>&quot;bên&quot; = over there, common for foreign countries<\/small><i>✓ South 那邊 / “bên này”<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 5 · Phương<\/div><div class=\"alorig\">Dạ không, em là người Đồng Nai, nhưng em sống ở Sài Gòn lâu rồi.<\/div><div class=\"al\"><b>Em ở Sài Gòn lâu rồi.<\/b><small>&quot;ở&quot; alone often means &quot;live&quot;<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 6 · Mike<\/div><div class=\"alorig\">Em sống ở Sài Gòn bao lâu rồi?<\/div><div class=\"al\"><b>Em lên Sài Gòn lâu chưa?<\/b><small>Have you been in Saigon long? (&quot;lên&quot; = go up to Saigon from the provinces)<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 7 · Phương<\/div><div class=\"alorig\">Dạ, cũng hơn bảy năm rồi anh. Mà anh là người Đức hả?<\/div><div class=\"al\"><b>Vậy anh là người Đức phải không?<\/b><small>So you&#x27;re German, right? (neutral)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 8 · Mike<\/div><div class=\"alorig\">Đúng rồi. Nhưng ba anh là người Hoa, còn mẹ anh là người Trung Quốc.<\/div><div class=\"al\"><b>Ba anh gốc Hoa.<\/b><small>My dad is of Chinese descent.<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Bố anh … / Má anh …<\/b><small>&quot;bố&quot; = Northern for dad, &quot;má&quot; = traditional Southern for mom<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 9 · Phương<\/div><div class=\"alorig\">Ồ, thú vị quá! Ba anh quê ở đâu?<\/div><div class=\"al\"><b>Thú vị ghê!<\/b><small>How interesting! (&quot;ghê&quot; = Southern intensifier)<\/small><i>✗ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 10 · Mike<\/div><div class=\"alorig\">Ba anh là người Cần Thơ. Em đi Cần Thơ lần nào chưa?<\/div><div class=\"al\"><b>Ba anh gốc Cần Thơ.<\/b><small>My dad is originally from Cần Thơ.<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Em từng đi Cần Thơ chưa?<\/b><small>Have you ever been to Cần Thơ?<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 11 · Phương<\/div><div class=\"alorig\">Em chưa, em chưa đi miền Tây bao giờ. Ở nhà anh nói tiếng gì?<\/div><div class=\"al\"><b>Dạ chưa, em chưa đi lần nào.<\/b><small>No, I&#x27;ve never been. (the negative answer)<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Anh nói tiếng gì với ba mẹ?<\/b><small>What do you speak with your parents?<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 12 · Mike<\/div><div class=\"alorig\">Ở nhà anh chỉ nói tiếng Trung. Em có biết nói tiếng Trung không?<\/div><div class=\"al\"><b>Ở nhà anh nói tiếng Hoa thôi.<\/b><small>&quot;thôi&quot; at the end = only; &quot;tiếng Hoa&quot; is common in the South for Chinese<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Em biết nói tiếng Trung không?<\/b><small>Can you speak Mandarin? (casual, drops &quot;có&quot;)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 13 · Phương<\/div><div class=\"alorig\">Em đang học tiếng Trung, nên chỉ biết nói một chút. Anh năm nay bao nhiêu tuổi?<\/div><div class=\"al\"><b>Em nói được chút xíu.<\/b><small>I can speak a tiny bit. (Southern)<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Anh sinh năm mấy?<\/b><small>What year were you born? (common, used to decide anh/em/chị)<\/small><i>✗ South<\/i><\/div><div class=\"al\"><b>Anh nhiêu tuổi rồi?<\/b><small>How old are you? (casual Southern, clipped &quot;bao&quot;)<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 14 · Mike<\/div><div class=\"alorig\">Anh ba mươi tám tuổi. Còn em, em sinh năm mấy?<\/div><div class=\"al\"><b>Anh ba tám tuổi.<\/b><small>I&#x27;m 38. (colloquial, clipped number)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 15 · Phương<\/div><div class=\"alorig\">Em sinh năm hai ngàn. Anh đang làm công việc gì?<\/div><div class=\"al\"><b>Dạ, em hai mươi sáu tuổi.<\/b><small>I&#x27;m 26. (answering with age instead of year)<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Dạ, em sinh năm hai nghìn.<\/b><small>&quot;nghìn&quot; = Northern for &quot;ngàn&quot; (thousand)<\/small><i>✓<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 16 · Mike<\/div><div class=\"alorig\">Anh là giáo viên tiếng Đức. Mình đều là giáo viên ha!<\/div><div class=\"al\"><b>Mình cùng nghề ha!<\/b><small>Same job, huh!<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 17 · Phương<\/div><div class=\"alorig\">Dạ đúng rồi! Anh đang sống ở Đức hả?<\/div><div class=\"al\"><b>Dạ phải!<\/b><small>Yes! (Southern)<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 18 · Mike<\/div><div class=\"alorig\">Không, bây giờ anh sống ở Bồ Đào Nha và dạy online. Em đi Bồ Đào Nha lần nào chưa?<\/div><div class=\"al\"><b>Không, giờ anh ở Bồ Đào Nha.<\/b><small>&quot;giờ&quot; = short for &quot;bây giờ&quot;<\/small><i>✓ South<\/i><\/div><\/div><div class=\"ab\"><div class=\"kicker\">Line 19 · Phương<\/div><div class=\"alorig\">Dạ chưa, nhưng nghe nói ở đó đẹp lắm.<\/div><div class=\"al\"><b>Dạ, em chưa đi lần nào.<\/b><small>No, I&#x27;ve never been.<\/small><i>✓ South<\/i><\/div><div class=\"al\"><b>Nghe nói bên đó đẹp lắm.<\/b><small>&quot;bên đó&quot; = over there<\/small><i>✓<\/i><\/div><\/div>"},{"t":"Lesson notes","h":"<p>Lesson 1 · 10 Oct 2026<\/p><div class=\"nts\"><div class=\"nt\"><b>khoảng<\/b><span>大約<\/span><small>around<\/small><\/div><div class=\"nt\"><b>khác<\/b><span>別的、其他<\/span><small>other<\/small><\/div><div class=\"nt\"><b>văn phòng<\/b><span>辦公室<\/span><small>office<\/small><\/div><div class=\"nt\"><b>khi<\/b><span>……的時候<\/span><small>when<\/small><\/div><div class=\"nt\"><b>tự<\/b><span>自己<\/span><small>(do something) by yourself<\/small><\/div><div class=\"nt\"><b>học<\/b><span>學<\/span><small>learn<\/small><\/div><div class=\"nt\"><b>nếu<\/b><span>如果<\/span><small>if<\/small><\/div><div class=\"nt\"><b>sau đó<\/b><span>之後、後來<\/span><small>after that<\/small><\/div><div class=\"nt\"><b>như thế nào<\/b><span>怎麼樣、如何<\/span><small>how<\/small><\/div><div class=\"nt\"><b>tính ra<\/b><span>算下來、結果<\/span><small>it turns out, in total<\/small><\/div><div class=\"nt\"><b>Tính ra cũng tốt.<\/b><span>算下來也不錯。<\/span><small>All in all, it&#x27;s good. (another example of &quot;tính ra&quot;)<\/small><\/div><div class=\"nt\"><b>Em thích dạy tiếng Việt vì được nói chuyện với nhiều người ở nhiều quốc gia.<\/b><span>我喜歡教越南語，因為可以跟很多國家的人聊天。<\/span><small>I like teaching Vietnamese because I get to talk to many people from many countries.<\/small><\/div><div class=\"nt\"><b>Em không thể nhớ được mặt chữ.<\/b><span>我記不住字長什麼樣子。<\/span><small>I can&#x27;t remember what the characters look like.<\/small><\/div><div class=\"nt\"><b>Em bắt đầu học tiếng Anh khi vào tiểu học. Nhưng em không thể nói được tiếng Anh.<\/b><span>我上小學的時候開始學英文，但是我不會說英文。<\/span><small>I started learning English when I started primary school. But I couldn&#x27;t speak English.<\/small><\/div><div class=\"nt\"><b>Sau đó, khi vào đại học em tự học tiếng Anh.<\/b><span>後來上大學的時候，我自學英文。<\/span><small>After that, when I got to university, I taught myself English.<\/small><\/div><div class=\"nt\"><b>Em có học ngôn ngữ khác không?<br>Em có học tiếng khác không?<\/b><span>你有在學其他語言嗎？<\/span><small>Are you learning any other languages? (&quot;ngôn ngữ&quot; = language, more formal; &quot;tiếng&quot; = language, everyday)<\/small><\/div><div class=\"nt\"><b>Một ngày anh thường làm việc mấy tiếng?<\/b><span>你一天通常工作幾個小時？<\/span><small>How many hours a day do you usually work?<\/small><\/div><div class=\"nt\"><b>Anh dạy khoảng 8 tiếng, nhưng anh phải chuẩn bị bài nên tính ra anh làm việc 10 tiếng một ngày.<\/b><span>我大約教八個小時，但是還要備課，所以算下來我一天工作十個小時。<\/span><small>I teach about 8 hours, but I have to prepare lessons, so all in all I work 10 hours a day.<\/small><\/div><div class=\"nt\"><b>Em cũng phải chuẩn bị bài nhiều phải không?<br>Em có phải chuẩn bị bài nhiều không?<\/b><span>你也要備很多課，對吧？<br>你要備很多課嗎？<\/span><small>You also have to prepare a lot (of lessons), right? (checking)<br>Do you have to prepare a lot (of lessons)? (open question)<\/small><\/div><div class=\"nt\"><b>Không nhiều lắm.<\/b><span>沒有很多。<\/span><small>Not that much.<\/small><\/div><div class=\"nt\"><b>Anh dạy một lớp bao nhiêu học sinh?<\/b><span>你一個班教幾個學生？<\/span><small>How many students do you teach in one class?<\/small><\/div><div class=\"nt\"><b>Anh dạy 1-1, thỉnh thoảng có lớp 4 đến 6 người.<br>Anh dạy 1-1, thỉnh thoảng có lớp 4 đến 6 học sinh.<\/b><span>我教一對一，有時候也有四到六個人的班。<br>……四到六個學生的班。<\/span><small>I teach one-on-one, sometimes there are classes of 4 to 6 people.<br>… of 4 to 6 students.<\/small><\/div><div class=\"nt\"><b>Em có dạy lớp nhóm không?<\/b><span>你有教團體班嗎？<\/span><small>Do you teach group classes?<\/small><\/div><div class=\"nt\"><b>Em thích dạy 1 1 vì em sẽ kiểm soát được mức độ theo bài của học sinh.<\/b><span>我喜歡教一對一，因為可以依照學生的課程來掌控程度。<\/span><small>I like teaching one-on-one because I can control the level according to the student&#x27;s lessons.<\/small><\/div><\/div>"}],"pos":1}]};
const CORE = (function () {
// core.js: the learning logic, no DOM. Used by the app (build.py inlines it) and by app/tests.
// Copied from ~/Documents/tieng-viet/app/core.js on 11 Oct 2026 (scheduling and sync unchanged). New here: every
// item has two directions, L (Phương's audio -> meaning) and S (中文 -> say it); lessons are the dialogues.
// Scheduling is ported from the kids' app (~/Documents/quizzes/src/engine.js): boxes 1 to 9, own interval
// and ease per card, a forgotten sure card falls back two boxes, problem cards stay in box 2.
// Differences: every day is a practice day (Mike, 1 Oct 2026), the round is limited by time, not by card count,
// and the grade comes from two buttons (Again / Got it), because the app cannot hear you.

const INTERVAL = {1: 1, 2: 2, 3: 4, 4: 8, 5: 15, 6: 30, 7: 60, 8: 120, 9: 240};   // in days
const MAX_BOX = 9, SURE_BOX = 4, RECALL_BOX = 3;
const LEECH_MISS = 5, LEECH_OK = 3;
const MINUTES = [10, 15, 20, 30], MIN_DEFAULT = 15;   // Mike 2026-10-01: every day, 15 minutes, changeable on the home screen
const NEW_MAX = 10;                    // Mike 11 Oct 2026: 10 a day (tieng-viet: 6), so a weekly dialogue fits into a week
const NEW_SHARE = 0.6;                 // new cards take at most 60 % of the time (tieng-viet: 40 %), needed for 10 a day at 20 minutes
const budgetMs = S => ((S.cfg && S.cfg.min) || MIN_DEFAULT) * 60000;
const REQUEUE_GAP = 4;
const MAX_RETRIES = 2;                 // at most two more tries of one card in a round
const MS_CAP = 120000;                 // time counted per card at most                 // "Again" brings the card back four cards later
const EST0 = {new: 75000, echo: 25000, recall: 25000, listen: 20000};

// ----- days -----
function dayOf(ms) { const d = new Date(ms); return Math.floor((ms - d.getTimezoneOffset() * 60000) / 86400000); }
const dow = d => ((d + 3) % 7 + 7) % 7;                       // 0 = Monday ... 6 = Sunday
// Every day counts (Mike, 1 Oct 2026). The names stay from the time of five practice days a week.
const practiceDay = d => d;
const addPractice = (d, n) => d + n;
const practiceBetween = (a, b) => Math.max(0, b - a);
const monday = d => d - dow(d);
function isoDate(d) { return new Date(d * 86400000).toISOString().slice(0, 10); }

// ----- cards -----
function isLeech(c) { return !!c && (c.miss || 0) >= LEECH_MISS && (c.ok || 0) < LEECH_OK; }
function planCard(c, t, easy) {
  c.ease = c.ease || 2.5;
  const prev = c.iv || INTERVAL[Math.max(1, (c.box || 1) - 1)] || 1;
  const elapsed = c.last != null ? practiceBetween(c.last, t) : prev;
  let iv;
  if ((c.box || 0) <= 3) iv = INTERVAL[c.box] || 1;                       // learning phase: 1, 2, 4 days
  else iv = Math.max(Math.max(prev, (prev + elapsed) / 2) * c.ease * (easy ? 1.3 : 1), prev + 1);   // Easy: 30 % further, as "easy" in the kids' engine
  iv = Math.min(365, Math.max(1, Math.round(iv)));
  if (iv >= 4 && c.box > 3) { const f = Math.max(1, Math.round(iv * 0.05)); iv = Math.min(365, iv + Math.floor(Math.random() * (2 * f + 1)) - f); }   // spread a little, no clumps
  if (isLeech(c)) iv = Math.min(iv, 2);
  c.iv = iv; c.last = t; c.due = addPractice(t, iv);
}
function lapseCard(c, t) { c.ease = Math.max(1.3, (c.ease || 2.5) - 0.2); c.iv = Math.max(1, Math.round((c.iv || 1) * 0.3)); c.last = t; c.due = addPractice(t, 1); }
function newCard(t) { return {box: 0, ease: 2.5, miss: 0, ok: 0, n: 0, ag: 0, born: t, due: t}; }   // due: an interrupted first meeting comes back

// What the card asks for. Drills are only ever repeated after the voice; sentences from box 3 on are said from the meaning.
// L cards: listen first, then reveal. S cards: listen and repeat with the text, from box 3 say it from the 中文.
function modeOf(item, c) {
  if (!c || !c.box) return "new";
  if (item.dir === "L") return "listen";
  return c.box >= RECALL_BOX ? "recall" : "echo";
}

// ----- lessons -----
const practised = (D, L) => L.ids.filter(id => D.sent[id] && D.sent[id].kind === "s");
// The current lesson (dialogue) is the first one that still has cards you have not met.
function currentLesson(S, D) {
  for (const L of D.lessons) if (practised(D, L).some(id => !S.cards[id])) return L;
  return D.lessons[D.lessons.length - 1];
}
function nextNew(S, D) { return practised(D, currentLesson(S, D)).filter(id => !S.cards[id]); }

// ----- the daily round -----
function estOf(S, m) { return (S.avg && S.avg[m]) || EST0[m]; }
// A card costs its own time plus, with the share of first answers that were Again, one more listen-and-repeat.
function costOf(S, m) { return estOf(S, m) + (S.ar == null ? 0.12 : S.ar) * estOf(S, "echo"); }
function buildRound(S, D, T) {
  const items = [], BUDGET = budgetMs(S); let est = 0, backlog = 0;
  const due = Object.keys(S.cards).filter(id => D.sent[id] && D.sent[id].kind === "s" && !S.cards[id].ret && S.cards[id].due <= T)

  const L = currentLesson(S, D), R = S.round && S.round.day === t ? S.round : null;
  const pending = nextNew(S, D).length, introNeeded = pending && !(S.introRead || {})[L.key];
  let main = "";
  if (introNeeded) {
    main = '<div class="kicker">New dialogue</div><h2>' + esc(L.title) + '</h2><p>Read the dialogue and the lesson notes first, then the new cards start.</p>' +
      '<button class="btn primary big" data-act="lesson" data-key="' + L.key + '">Read the dialogue</button><hr class="sep">';
  }
  if (R && roundDone(R)) {
    const nc = R.items.filter(x => !x.retry).length, mn = Math.max(1, Math.round(R.ms / 60000));
    main += '<div class="kicker">Today</div><h2>Done for today.</h2><p>' + nc + (nc === 1 ? " card in " : " cards in ") + mn + (mn === 1 ? " minute." : " minutes.") + " Next round tomorrow.</p>";
  } else if (R) {
    main += '<div class="kicker">Today</div><h2>Round in progress</h2><p>Card ' + (R.pos + 1) + " of " + R.items.length + ".</p>" +
      '<button class="btn primary big" data-act="start">Continue</button>';
  } else {
    const P = buildRound(S, D, t), nNew = P.items.filter(x => x.m === "new").length, nRev = P.items.length - nNew, min = Math.max(1, Math.round(P.est / 60000));
    if (!P.items.length) {
      const log = dayLog(S, t); if (!log.done && !introNeeded && Object.keys(S.cards).length) { log.done = true; log.free = true; save(); }
      if (!introNeeded || Object.keys(S.cards).length) main += '<div class="kicker">Today</div><h2>Nothing due today.</h2>';
    } else main += '<div class="kicker">Today</div><h2>About ' + min + (min === 1 ? " minute" : " minutes") + "</h2><p>" +
      nRev + (nRev === 1 ? " review" : " reviews") + (nNew ? ", " + nNew + " new" : "") + (P.backlog ? ". " + P.backlog + " more are waiting, new cards pause until they are through." : ".") + "</p>" +
      '<button class="btn primary big" data-act="start">Start</button>';
  }
  if (!pending && !introNeeded) main += '<p class="muted">All cards of dialogue ' + L.n + " are in. The next dialogue comes after your lesson with Phương.</p>";
  const w = weekSnapshot(t), dots = weekDots();
  const wk = '<div class="kicker">This week</div>' + dots.html + '<p class="muted">' + dots.n + " of 7 days. " + w.sure + " cards sure" +
    (w.gain > 0 ? ", " + w.gain + " more than on Monday" : "") + (w.prev != null ? ". Last week: " + (w.prev >= 0 ? "+" : "") + w.prev + "." : ".") + "</p>";
  const mins = (S.cfg && S.cfg.min) || MIN_DEFAULT;
  $("home").innerHTML =
    "<header><h1>" + TITLE + '</h1><div class="sub">Dialogue ' + L.n + ": " + esc(L.title) + "</div></header>" +
    '<div class="panel">' + main + "</div>" +
    '<div class="panel">' + wk + "</div>" +
    '<div class="grid">' +
    '<button class="btn tile" data-act="go" data-to="listen">Listen<small>the dialogue line by line, for echoing</small></button>' +
    '<button class="btn tile" data-act="go" data-to="library">Sentences<small>everything you have met</small></button>' +
    '<button class="btn tile" data-act="go" data-to="lessons">Dialogues<small>text and lesson notes</small></button>' +
    '<button class="btn tile" data-act="go" data-to="practice">Practise<small>any dialogue, freely</small></button>' +
    "</div>" +
    '<div class="panel minutes"><span>Minutes a day</span><span class="seg">' + MINUTES.map(m => '<button class="btn' + (m === mins ? " on" : "") + '" data-act="mins" data-m="' + m + '">' + m + "</button>").join("") + "</span></div>" +
    '<footer><span id="sync">' + syncText() + "</span><span>v " + APP_BUILD + "</span></footer>";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "mins") { S.cfg = Object.assign({}, S.cfg, {min: +b.dataset.m}); S.cfgTs = Date.now(); save(); renderHome(); }
  if (b.dataset.act === "start") startRound();
  if (b.dataset.act === "lesson") show("page", {key: b.dataset.key, i: 0});
});

// ----- the round -----
let cs = null;   // card state: {revealed, shownAt, notes}
function startRound() {
  const t = today();
  if (!S.round || S.round.day !== t) { S.round = buildRound(S, D, t); UNDO = null; save(); }
  if (roundDone(S.round)) { settleRound(); show("home"); return; }
  cs = null; show("card");
}
const MODE_LABEL = {new: "New", echo: "Listen and repeat", recall: "Say it in Vietnamese", listen: "Listen: what does it mean?"};
function renderCard() {
  const R = S.round, it = R.items[R.pos], item = D.sent[it.id];
  if (!cs || cs.id !== it.id + ":" + R.pos) cs = {id: it.id + ":" + R.pos, revealed: it.m !== "recall" && it.m !== "listen", shownAt: Date.now(), notes: it.m === "new"};
  const pct = Math.round(100 * R.pos / R.items.length);
  const kind = item.dir === "L" ? "Listening" : "Speaking";
  let body = "";
  if (!cs.revealed && it.m === "listen") {
    body = '<p class="hint">Listen to Phương. What does it mean? Then check.</p>' +
      '<div class="plays"><button class="btn play big" data-play="' + it.id + '" data-act="cplay">' + ICON.play + "<span>Play</span></button>" +
      '<button class="btn play" data-play="' + it.id + '" data-act="cplay" data-slow="1">' + ICON.play + "<span>Slow</span></button></div>" +
      '<button class="btn primary big" data-act="reveal" data-noplay="1">Check</button>';
  } else if (!cs.revealed) {
    body = whoHtml(item) + '<div class="zh big">' + esc(item.zh) + '</div><div class="meaning">' + esc(item.en) + "</div>" +
      '<p class="hint">Say it in Vietnamese, out loud. Then check.</p>' +
      '<button class="btn primary big" data-act="reveal">Check</button>';
  } else {
    body = sentenceHtml(item) +
      ((item.x || item.pn) ? (cs.notes ? '<div class="notes">' + noteHtml(item) + "</div>" : '<button class="link" data-act="notes">Notes</button>') : "") +
      '<div class="plays">' +
      '<button class="btn play big" data-play="' + it.id + '" data-act="cplay">' + ICON.play + "<span>Play</span></button>" +
      '<button class="btn play" data-play="' + it.id + '" data-act="cplay" data-slow="1">' + ICON.play + "<span>Slow</span></button></div>" +
      (it.m === "new" ? '<p class="hint small">Play it, say it, play it again. Then rate yourself.</p>' : "") +
      '<div class="rate"><button class="btn again" data-act="rate" data-r="again">Again</button>' +
      '<button class="btn ok" data-act="rate" data-r="ok">Got it</button>' +
      '<button class="btn easy" data-act="rate" data-r="easy">Easy</button></div>';
  }
  $("card").innerHTML =
    '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + '</button><div class="bar"><i style="width:' + pct + '%"></i></div><span class="count">' + (R.pos + 1) + "/" + R.items.length + "</span>" + undoLink() + "</div>" +
    '<div class="card"><div class="kicker">' + kind + " · " + MODE_LABEL[it.m] + (it.retry ? ", once more" : "") + " · " + (TYPE_LABEL[item.type] || "") + "</div>" + body + "</div>";
  const nxt = R.items[R.pos + 1]; if (nxt) preload(nxt.id);
}
function cardPlay(slow) { const it = S.round.items[S.round.pos]; play(it.id, slow); }
let UNDO = null;
const undoLink = () => UNDO ? '<button class="link undo" data-act="undo">Undo</button>' : "";
function undoLast() {
  if (!UNDO) return;
  applyUndo(S, UNDO); UNDO = null; cs = null; stopAudio(); save();
  if (S.round && !roundDone(S.round) && S.round.day === today()) show("card"); else show("home");
}
document.addEventListener("click", e => { if (e.target.closest('[data-act="undo"]')) { e.stopImmediatePropagation(); undoLast(); } }, true);
function rate(r) {
  const R = S.round, it = R && R.items[R.pos];
  if (!cs || !it || cs.id !== it.id + ":" + R.pos) { if (it) renderCard(); else show("home"); return; }
  if (R.day !== today()) { show("home"); return; }
  const ms = Date.now() - cs.shownAt;
  UNDO = undoPoint(S, R, today());
  answer(S, D, R, r, today(), ms); cs = null; stopAudio();
  if (roundDone(R)) dayLog(S, R.day).done = true;
  save();
  if (roundDone(R)) show("home"); else renderCard();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "card") return;
  const a = b.dataset.act;
  if (a === "cplay") { e.stopImmediatePropagation(); cardPlay(b.dataset.slow === "1"); }
  if (a === "reveal") { cs.revealed = true; cs.notes = false; if (!b.dataset.noplay) cardPlay(false); renderCard(); }
  if (a === "notes") { cs.notes = true; renderCard(); }
  if (a === "rate") rate(b.dataset.r);
}, true);
document.addEventListener("keydown", e => {   // on the Mac: space play, s slow, enter check, 1 again, 2 got it, 3 easy
  if (cur !== "card" || e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "INPUT") return;
  const q = s => document.querySelector("#card " + s);
  if (e.key === " ") { e.preventDefault(); if (q('[data-act="cplay"]')) cardPlay(false); }
  else if (e.key === "s") { if (q('[data-act="cplay"]')) cardPlay(true); }
  else if (e.key === "Enter") { const b = q('[data-act="reveal"]'); if (b) b.click(); }
  else if (e.key === "1") { if (q('[data-r="again"]')) rate("again"); }
  else if (e.key === "2") { if (q('[data-r="ok"]')) rate("ok"); }
  else if (e.key === "3") { if (q('[data-r="easy"]')) rate("easy"); }
});

// ----- free practice: any dialogue, any time. Got it changes nothing; Again makes the card due tomorrow. -----
let PR = null;
function renderPractice() {
  const back = '<div class="top"><button class="icon" data-act="' + (PR ? "prquit" : "go") + '" data-to="home" aria-label="Back">' + ICON.back + "</button>";
  if (!PR) {
    $("practice").innerHTML = back + "</div><header><h1>Practise</h1><div class=\"sub\">Go through a dialogue freely. Got it changes nothing; Again brings the card into tomorrow's round.</div></header>" +
      D.lessons.map(L => { const n = practised(D, L).filter(id => S.cards[id] && S.cards[id].box).length;
        return n ? '<button class="btn tile wide" data-act="prstart" data-key="' + L.key + '">Dialogue ' + L.n + ": " + esc(L.title) + "<small>" + n + (n === 1 ? " card" : " cards") + "</small></button>" : ""; }).join("") +
      (D.lessons.some(L => practised(D, L).some(id => S.cards[id] && S.cards[id].box)) ? "" : '<p class="muted">Nothing to practise yet.</p>');
    return;
  }
  if (PR.pos >= PR.items.length) {
    $("practice").innerHTML = back + '</div><div class="panel"><h2>Done.</h2><p>' + PR.done + (PR.done === 1 ? " card" : " cards") + " practised." +
      (PR.again ? " " + PR.again + " of them come back in tomorrow's round." : "") + '</p><button class="btn primary big" data-act="prquit">Back</button></div>';
    return;
  }
  const id = PR.items[PR.pos], item = D.sent[id], hidden = item.dir === "L" ? "listen" : "say";
  if (!PR.cs || PR.cs.id !== id + ":" + PR.pos) PR.cs = {id: id + ":" + PR.pos, revealed: false};
  const q = PR.cs, pct = Math.round(100 * PR.pos / PR.items.length);
  const body = !q.revealed
    ? (hidden === "listen"
      ? '<p class="hint">Listen. What does it mean?</p><div class="plays"><button class="btn play big" data-play="' + id + '" data-act="play" data-id="' + id + '">' + ICON.play + '<span>Play</span></button></div><button class="btn primary big" data-act="prreveal" data-noplay="1">Check</button>'
      : whoHtml(item) + '<div class="zh big">' + esc(item.zh) + '</div><div class="meaning">' + esc(item.en) + '</div><p class="hint">Say it in Vietnamese, out loud. Then check.</p><button class="btn primary big" data-act="prreveal">Check</button>')
    : sentenceHtml(item) + ((item.x || item.pn) ? '<div class="notes">' + noteHtml(item) + "</div>" : "") +
      '<div class="plays"><button class="btn play big" data-play="' + id + '" data-act="play" data-id="' + id + '">' + ICON.play + "<span>Play</span></button>" +
      '<button class="btn play" data-play="' + id + '" data-act="play" data-id="' + id + '" data-slow="1">' + ICON.play + "<span>Slow</span></button></div>" +
      '<div class="rate"><button class="btn again" data-act="prrate" data-r="again">Again</button><button class="btn ok" data-act="prrate" data-r="ok">Got it</button></div>';
  $("practice").innerHTML = back + '<div class="bar"><i style="width:' + pct + '%"></i></div><span class="count">' + (PR.pos + 1) + "/" + PR.items.length + "</span></div>" +
    '<div class="card"><div class="kicker">Free practice, dialogue ' + PR.n + "</div>" + body + "</div>";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "practice") return;
  const a = b.dataset.act;
  if (a === "prstart") {
    const L = D.lessons.find(x => x.key === b.dataset.key), ids = practised(D, L).filter(id => S.cards[id] && S.cards[id].box);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    PR = {key: L.key, n: L.n, items: ids, pos: 0, done: 0, again: 0, cs: null}; renderPractice();
  }
  if (a === "prquit") { PR = null; stopAudio(); show("home"); }
  if (a === "prreveal") { PR.cs.revealed = true; if (!b.dataset.noplay) play(PR.items[PR.pos], false); renderPractice(); }
  if (a === "prrate") {
    const id = PR.items[PR.pos];
    if (b.dataset.r === "again") {
      if (practiceAgain(S, id, today())) save();
      if (PR.items.indexOf(id, PR.pos + 1) < 0) PR.items.splice(Math.min(PR.pos + 5, PR.items.length), 0, id);
      PR.again += PR.items.indexOf(id) === PR.pos ? 1 : 0;
    } else PR.done++;
    stopAudio(); PR.pos++; PR.cs = null; renderPractice();
  }
});

// ----- listen: the dialogue of the current lesson line by line, with a pause to repeat (echoing) -----
let LS = {on: false, i: 0, slow: false, echo: true, timer: 0, list: []};
function listenList() { const L = currentLesson(S, D); return L.ids.filter(id => D.sent[id].dir === "L" && D.sent[id].type === "line"); }
function renderListen() {
  LS.list = listenList(); if (LS.i >= LS.list.length) LS.i = 0;
  const id = LS.list[LS.i], item = id && D.sent[id], L = currentLesson(S, D);
  $("listen").innerHTML = '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + "</button></div>" +
    '<header><h1>Listen</h1><div class="sub">Dialogue ' + L.n + ", " + LS.list.length + " lines. Each line plays, then a pause to say it" + (LS.echo ? ", then once more." : ".") + "</div></header>" +
    '<div class="card">' + (item ? '<div class="kicker">' + (LS.i + 1) + " of " + LS.list.length + "</div>" + sentenceHtml(item) : "<p>Nothing to play yet.</p>") + "</div>" +
    '<div class="plays"><button class="btn primary big" data-act="lstart">' + (LS.on ? ICON.stop + "<span>Stop</span>" : ICON.play + "<span>" + (LS.i ? "Go on" : "Start") + "</span>") + "</button></div>" +
    '<div class="toggles"><label><input type="checkbox" id="l_slow"' + (LS.slow ? " checked" : "") + "> slow</label>" +
    '<label><input type="checkbox" id="l_echo"' + (LS.echo ? " checked" : "") + "> play twice</label>" +
    (LS.i ? '<button class="link" data-act="lreset">from the start</button>' : "") + "</div>";
}
function stopListen() { LS.on = false; clearTimeout(LS.timer); if (cur === "listen") stopAudio(); }
function listenStep(second) {
  if (!LS.on) return;
  const id = LS.list[LS.i]; if (!id) { stopListen(); LS.i = 0; renderListen(); return; }
  renderListen();
  play(id, LS.slow, () => {
    const gap = Math.max(1500, (A.duration || 2) * 1000 * (LS.slow ? 1.6 : 1.2) + 1000);
    LS.timer = setTimeout(() => {
      if (!LS.on) return;
      if (LS.echo && !second) listenStep(true);
      else { LS.i++; if (LS.i >= LS.list.length) { LS.on = false; LS.i = 0; renderListen(); } else listenStep(false); }
    }, gap);
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "listen") return;
  if (b.dataset.act === "lstart") { if (LS.on) { stopListen(); renderListen(); } else { LS.on = true; listenStep(false); } }
  if (b.dataset.act === "lreset") { stopListen(); LS.i = 0; renderListen(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "l_slow") LS.slow = e.target.checked;
  if (e.target.id === "l_echo") { LS.echo = e.target.checked; if (!LS.on) renderListen(); }
});

// ----- sentences: everything met so far, searchable -----
let libQuery = "", libOpen = null;
function renderLibrary() {
  $("library").innerHTML = '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + "</button></div>" +
    '<header><h1>Sentences</h1></header><input id="q" type="search" placeholder="Search Vietnamese, English or 中文" value="' + esc(libQuery) + '" autocomplete="off">' +
    '<div id="liblist"></div>';
  renderLibList();
}
function metItem(id) { const k = D.sent[id].item; return S.cards[k + ":L"] || S.cards[k + ":S"]; }
function renderLibList() {
  const q = fold(libQuery.trim());
  let h = "";
  for (const L of D.lessons) {
    const ids = itemIds(L).filter(id => metItem(id) && (!q || fold(D.sent[id].vi + " " + D.sent[id].en + " " + D.sent[id].zh).includes(q)));
    if (!ids.length) continue;
    h += '<div class="kicker sect">Dialogue ' + L.n + ": " + esc(L.title) + "</div>";
    for (const id of ids) {
      const it = D.sent[id], c = metItem(id), st = c.box >= SURE_BOX ? "sure" : c.box ? "learning" : "new";
      h += '<div class="row" data-row="' + id + '">' + playBtn(id) + '<div class="rt">' + (libOpen === id ? sentenceHtml(it, true) + ((it.x || it.pn) ? '<div class="notes">' + noteHtml(it) + "</div>" : "")
          : '<div class="vi s">' + esc(it.vi) + '</div><div class="meaning s">' + esc(it.en) + "</div>") + '</div><span class="tag ' + st + '">' + st + "</span></div>";
    }
  }
  $("liblist").innerHTML = h || '<p class="muted">Nothing found.</p>';
}
document.addEventListener("input", e => { if (e.target.id === "q") { libQuery = e.target.value; renderLibList(); } });
document.addEventListener("click", e => {
  if (cur !== "library" || e.target.closest("[data-act]")) return;
  const r = e.target.closest("[data-row]"); if (!r) return;
  libOpen = libOpen === r.dataset.row ? null : r.dataset.row; renderLibList();
});

// ----- dialogues: the text with play buttons, and the lesson notes -----
function renderLessons() {
  $("lessons").innerHTML = '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + "</button></div><header><h1>Dialogues</h1></header>" +
    D.lessons.map(L => { const P = practised(D, L), met = P.filter(id => S.cards[id]).length;
      return '<button class="btn tile wide" data-act="lesson" data-key="' + L.key + '">Dialogue ' + L.n + ": " + esc(L.title) + "<small>" + met + " of " + P.length + " cards met</small></button>"; }).join("");
}
function renderPage(arg) {
  const L = D.lessons.find(x => x.key === arg.key), i = arg.i, P = L.pages[i], last = i === L.pages.length - 1, unread = !(S.introRead || {})[L.key];
  $("page").innerHTML = '<div class="top"><button class="icon" data-act="go" data-to="' + (unread ? "home" : "lessons") + '" aria-label="Back">' + ICON.back + '</button><span class="count">' + (i + 1) + "/" + L.pages.length + "</span></div>" +
    '<div class="panel page"><div class="kicker">Dialogue ' + L.n + "</div><h2>" + esc(P.t) + "</h2>" + P.h + "</div>" +
    '<div class="rate">' + (i ? '<button class="btn" data-act="pg" data-k="' + L.key + '" data-i="' + (i - 1) + '">Back</button>' : "<span></span>") +
    (last ? (unread ? '<button class="btn ok" data-act="pgdone" data-k="' + L.key + '">Start learning</button>' : '<button class="btn" data-act="go" data-to="lessons">Done</button>')
      : '<button class="btn ok" data-act="pg" data-k="' + L.key + '" data-i="' + (i + 1) + '">Next</button>') + "</div>";
  document.querySelectorAll("#page .al[data-card]").forEach(row => { if (D.sent[row.dataset.card]) row.insertAdjacentHTML("afterbegin", playBtn(row.dataset.card)); });
  // the dialogue page gets a play button per line
  document.querySelectorAll("#page .dl").forEach((row, k) => {
    const id = L.ids.filter(x => D.sent[x].dir === "L" && D.sent[x].type === "line")[k];
    if (id) row.insertAdjacentHTML("afterbegin", playBtn(id));
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "pg") show("page", {key: b.dataset.k, i: +b.dataset.i});
  if (b.dataset.act === "pgdone") {
    S.introRead = S.introRead || {}; S.introRead[b.dataset.k] = true;
    const t = today(), R = S.round;
    if (R && R.day === t) {
      const P = buildRound(S, D, t), have = new Set(R.items.map(x => x.id)), add = P.items.filter(x => x.m === "new" && !have.has(x.id));
      if (add.length) { R.items.push(...add); R.lesson = b.dataset.k; }
    }
    save(); show("home");
  }
});

// ================= start =================
// A device without any local state starts only after the cloud has answered.
function boot() {
  checkVersion();
  if (!SYNC_URL || Object.keys(S.cards).length || Object.keys(S.introRead || {}).length) { show("home"); cloudSync(); return; }
  $("home").innerHTML = "<header><h1>" + TITLE + '</h1></header><div class="panel"><p>Loading your progress …</p></div>';
  cloudGet().then(o => {
    if (o && o.cards) { adopt(o); setSync(true); }
    show("home");
  }).catch(() => {
    setSync(false);
    $("home").innerHTML = "<header><h1>" + TITLE + '</h1></header><div class="panel"><p>Could not reach the server, so your progress could not be loaded.</p>' +
      '<button class="btn primary big" data-act="retry">Try again</button></div>';
  });
}
document.addEventListener("click", e => { if (e.target.closest('[data-act="retry"]')) boot(); });
boot();

</script>
</body>
</html>
